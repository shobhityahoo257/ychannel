content:
  language: "hinglish"         # "hinglish" (Hindi + English words, Roman script) | "hindi" (Devanagari)

channel:
  name: "Bharat Rajneeti Today"
  handle: "@BharatRajneetiToday"
  logo: ""                     # optional PNG path (transparent background)
  accent_color: "#D90429"      # red broadcast accent
  dark_color: "#0B132B"
  language: "hi"

llm:
  provider: "auto"             # "auto" (whichever key you have) | "anthropic" | "openai"
  model: "claude-sonnet-5-5"   # Anthropic: curation, scripting, translation
  vision_model: "claude-sonnet-5-5"
  openai_model: "gpt-4o"       # OpenAI equivalent (must support tools + images)
  openai_vision_model: "gpt-4o"

feeds:   # verify these URLs once; feeds change. Add/remove freely.
  - {name: "BBC Hindi",        url: "https://feeds.bbci.co.uk/hindi/rss.xml"}
  - {name: "The Hindu",        url: "https://www.thehindu.com/news/national/feeder/default.rss"}
  - {name: "Hindustan Times",  url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml"}
  - {name: "Times of India",   url: "https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms"}
  - {name: "Indian Express",   url: "https://indianexpress.com/section/political-pulse/feed/"}
  - {name: "Google News (राजनीति)", url: "https://news.google.com/rss/search?q=%E0%A4%AD%E0%A4%BE%E0%A4%B0%E0%A4%A4+%E0%A4%B0%E0%A4%BE%E0%A4%9C%E0%A4%A8%E0%A5%80%E0%A4%A4%E0%A4%BF&hl=hi&gl=IN&ceid=IN:hi"}

curation:
  max_age_hours: 24
  min_sources: 2               # a story must be reported by >= N distinct outlets
  candidates_for_llm: 40

daily:
  shorts: 3
  long: 1

formats:
  short: {width: 1080, height: 1920, fps: 30, target_seconds: 60, max_scenes: 7,  captions: true,  ticker: false}
  analysis: {width: 1920, height: 1080, fps: 30, target_seconds: 540, max_scenes: 40, captions: true, ticker: false}
  long:  {width: 1920, height: 1080, fps: 30, target_seconds: 270, max_scenes: 14, captions: true, ticker: true}

images:
  inbox_dir: "inbox"           # drop your own photos here (see README)
  min_side_px: 700             # reject low-res images (look bad when zoomed)
  stock_mode: "auto_strict"    # where extra photos come from when you supply too few:
                               #   auto_strict = unattended runs fetch only photos the AI rates as a clear fit (>= stock_min_score)
                               #   off         = never fetch online photos
                               # (in the web app you always approve the photos yourself first - nothing is fetched automatically)
  stock_min_score: 8
  scout:                       # copyright-safe photo search (Wikimedia Commons + Openverse need no key; Pexels/Pixabay need a free key)
    providers: ["wikimedia", "openverse", "pexels", "pixabay"]
    allow_cc_by_sa: false      # CC BY-SA photos need share-alike; off by default. NonCommercial / NoDerivatives are always rejected.
    min_width: 1280
    per_need: 6
    recommend_from: 7          # candidates scoring at least this are pre-selected for your approval
  max_per_scene: 3
  library_dir: "library"       # your photo inventory: every photo you add is kept and reusable
  save_to_library: true        # add uploaded / stock photos to the inventory automatically
  use_library: true            # let the AI also pick relevant photos from the inventory
  auto_tag: true               # AI writes a caption + search tags for new photos (visible content only)

tts:
  provider: "auto"             # "auto" | "elevenlabs" | "openai" | "mock" (silent, for tests)
  openai_model: "gpt-4o-mini-tts"
  openai_voice: "onyx"         # alloy, ash, ballad, coral, echo, fable, nova, onyx, sage, shimmer
  language_code: "hi"          # hint for the voice model (Hinglish is read as Hindi with English words)
  openai_instructions:
    hinglish: "Speak natural Hinglish (Hindi with English words) like a confident, authoritative Indian news analyst on YouTube. Clear, energetic but controlled pace, firm tone, short pauses between points."
    hindi: "Speak in clear, natural Hindi like a calm, authoritative Indian TV news anchor. Steady pace, neutral tone."
  model_id: "eleven_multilingual_v2"
  stability: 0.45
  similarity_boost: 0.8
  style: 0.25
  speed: 1.0

playlists:                     # auto-organise published videos
  enabled: true
  categories: ["Sansad aur Niti", "Chunav", "Rajyon ki Rajneeti", "Arthvyavastha aur Budget", "Videsh Niti", "Adalat aur Kanoon"]
  format_playlists: {short: "Daily Political Shorts", long: "Poori Report", analysis: "Deep Analysis"}
  watch_next_links: 3          # "Watch next" links added to each description
  link_previous: true          # also add a link to the new video in the previous video of the same category
  privacy: "public"

endscreen:                     # long videos end with a card that leaves room for YouTube's end-screen elements
  enabled: true
  seconds: 12                  # YouTube allows end screens in the last 5-20 seconds

clips:                         # original speech/video clips that YOU supply (never auto-downloaded)
  max_seconds: 30              # longest excerpt used from any one clip
  max_share: 0.4               # clips may be at most 40% of the finished video

limits:
  max_uploads_per_day: 4

breaking:                      # breaking-news alerts: `python -m newschannel breaking`
  poll_minutes: 5
  window_hours: 3              # only look at stories published in the last N hours
  min_sources: 3               # at least this many different outlets must report it
  min_importance: 7            # the curator's 1-10 national-significance score
  max_alerts_per_day: 3
  target_seconds: 40           # breaking Shorts are short and fast
  active_hours: "06:00-23:30"  # India time; no alerts while you sleep

schedule:                      # used by `python -m newschannel schedule`
  timezone: "Asia/Kolkata"
  produce_at: "05:30"          # make the day's videos, then ask you to approve them (Telegram)
  breaking: true               # also watch for breaking news while the scheduler runs
  publish_slots: ["07:30", "12:30", "18:30"]   # one approved video goes out at each time

analysis:                      # deep-analysis videos (research -> fact ledger -> analysis)
  default_stance: "auto"       # "auto" = the tool recommends from the evidence | neutral | critical | supportive
  default_minutes: "auto"      # "auto" or a number between 5 and 15
  max_sources: 10
  # extra rules checked automatically on every script (regex, case-insensitive); see newschannel/deep.py for the defaults
  banned_patterns: null
  warn_patterns: null
  sources:                     # trust tiers; *.gov.in and *.nic.in count as official automatically
    tier1: null                # null = built-in list (PIB, PMO, Sansad, ECI, RBI, courts ...)
    tier2: null                # null = built-in list of agencies and major outlets
  music: "auto"                # off | auto (mood follows the angle) | calm | tension | warm

audio:
  generate_music: true         # make a royalty-free ambient bed when assets/music is empty (analysis videos)
  music_dir: "assets/music"    # put royalty-free .mp3/.wav here (optional)
  music_volume: 0.10
  target_lufs: -14

review:
  require_approval: true       # never auto-publish unless you turn this off
  telegram: true               # if token configured

youtube:
  category_id: "25"            # News & Politics
  privacy: "private"           # private | unlisted | public (private while testing)
  contains_synthetic_media: true
  default_tags: ["भारतीय राजनीति", "Indian Politics", "Hindi News", "ताज़ा खबर"]
  made_for_kids: false
  output_dir: "output"
